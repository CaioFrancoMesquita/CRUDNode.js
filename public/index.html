
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Alunos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">

        <h1>Sistema de Alunos</h1>

        <h2>Cadastro</h2>

        <form id="formAluno">

            <input type="hidden" id="id">

            <label>Nome:</label>
            <input type="text" id="nome" required>

            <label>Curso:</label>
            <input type="text" id="curso" required>

            <label>Semestre:</label>
            <input type="number" id="semestre" min="1" required>

            <button type="submit" id="botaoSalvar">Cadastrar</button>

            <button type="button" id="botaoCancelar" hidden>
                Cancelar edição
            </button>

        </form>

        <h2>Alunos cadastrados</h2>

        <table>
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Curso</th>
                    <th>Semestre</th>
                    <th>Ações</th>
                </tr>
            </thead>

            <tbody id="listaAlunos"></tbody>
        </table>

        <p id="mensagem"></p>

    </main>

    <script src="script.js"></script>

</body>
</html>
